# Branch model → container image (ghcr.io/<owner>/druckwunsch):
#   feature/<name>  → alpha-<name>, alpha-<name>-<sha>
#   develop         → preprod, preprod-<sha>
#   main            → prod, latest, prod-<sha>
#   tag v1.2.3      → 1.2.3, 1.2
# Pull requests into develop/main only run the tests.
name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Nicht gofmt-formatiert:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Kanal bestimmen
        id: channel
        run: |
          sha=${GITHUB_SHA::7}
          case "$GITHUB_REF" in
            refs/heads/main)    channel=prod ;;
            refs/heads/develop) channel=preprod ;;
            refs/heads/feature/*)
              slug=${GITHUB_REF#refs/heads/feature/}
              slug=$(printf '%s' "$slug" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9.-' '-' | cut -c1-40 | sed 's/-*$//')
              channel="alpha-$slug" ;;
            refs/tags/v*)       channel=release ;;
            *) echo "unbekannter Ref $GITHUB_REF"; exit 1 ;;
          esac
          if [ "$channel" = release ]; then version=$GITHUB_REF_NAME; else version="$channel-$sha"; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Kanal: $channel, Version: $version" >> "$GITHUB_STEP_SUMMARY"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.channel.outputs.channel }},enable=${{ steps.channel.outputs.channel != 'release' }}
            type=raw,value=${{ steps.channel.outputs.channel }}-{{sha}},enable=${{ steps.channel.outputs.channel != 'release' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Druckwunsch
            org.opencontainers.image.version=${{ steps.channel.outputs.version }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.channel.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
